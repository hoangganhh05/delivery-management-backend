spring.application.name=delivery-management

server.port=8080
server.servlet.context-path=/api/v1
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Kết nối và secret bắt buộc phải được cấp qua biến môi trường.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8443,https://delivery-frontend.hoang45682.workers.dev,https://genuine-ganache-5f9e66.netlify.app,https://delivery-management-frontend.vercel.app}
# VNPay is optional. The retired QR transfer flow is kept only for historical orders.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.return-url=${VNPAY_RETURN_URL:}

app.seed-vouchers=${SEED_VOUCHERS:false}

# Bootstrap tài khoản quản trị ban đầu. Mặc định tắt và không có mật khẩu hard-code.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}
app.bootstrap-admin.reset-password=${BOOTSTRAP_ADMIN_RESET_PASSWORD:false}

# Flyway owns production schema changes. An existing non-empty database is
# baselined at V1, then the remaining versioned migrations are applied.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Thông tin nhận chuyển khoản QR cũ. Để trống để ngừng tạo QR mới.
vietqr.bank-id=${VIETQR_BANK_ID:}
vietqr.account-number=${VIETQR_ACCOUNT_NUMBER:}
vietqr.account-name=${VIETQR_ACCOUNT_NAME:}

# Base64 của đúng 32 byte ngẫu nhiên. Chỉ cần khi bật lưu tài khoản nhận hoàn tiền/COD.
app.bank-account-encryption-key=${BANK_ACCOUNT_ENCRYPTION_KEY:}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false
