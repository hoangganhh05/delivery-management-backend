spring.application.name=delivery-management

server.port=8080
server.servlet.context-path=/api/v1

# Kết nối và secret bắt buộc phải được cấp qua biến môi trường.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
# VNPay is optional. The web client uses Vietcombank QR transfers by default.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.return-url=${VNPAY_RETURN_URL:}

app.seed-vouchers=${SEED_VOUCHERS:true}

# Bootstrap tài khoản quản trị ban đầu. Mặc định tắt và không có mật khẩu hard-code.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}
app.bootstrap-admin.reset-password=${BOOTSTRAP_ADMIN_RESET_PASSWORD:false}

# Flyway owns production schema changes. An existing non-empty database is
# baselined at V1, then the account-settings V2 migration is applied.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Thông tin nhận chuyển khoản QR (có thể ghi đè bằng biến môi trường khi deploy)
vietqr.bank-id=${VIETQR_BANK_ID:970436}
vietqr.account-number=${VIETQR_ACCOUNT_NUMBER:1070980445}
vietqr.account-name=${VIETQR_ACCOUNT_NAME:CAO HOANG ANH}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
